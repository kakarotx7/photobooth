<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Photo Booth ❤️</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #121016;
            --card-bg: rgba(255, 255, 255, 0.07);
            --border-color: rgba(255, 255, 255, 0.15);
            --primary: #ff4b72;
            --primary-hover: #ff2a55;
            --text-color: #f8f9fa;
            --text-dim: #a0a5b5;
            --filter-sepia: sepia(0.7) contrast(1.1);
            --filter-bw: grayscale(1) contrast(1.2);
            --filter-romantic: brightness(1.15) saturate(1.3) hue-rotate(-10deg);
            --filter-neon: contrast(1.4) saturate(2) hue-rotate(140deg);
            --filter-warm: sepia(0.3) saturate(1.4) contrast(1.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 75, 114, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(147, 51, 234, 0.15) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .app-container {
                grid-template-columns: 280px 1fr;
            }
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .controls-sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .room-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4b4b;
        }

        .status-dot.connected {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
        }

        button.btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .btn-grid button {
            padding: 8px 4px;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .btn-grid button.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .select-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .main-stage {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .viewfinders {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            position: relative;
        }

        @media (min-width: 480px) {
            .viewfinders {
                grid-template-columns: 1fr 1fr;
            }
        }

        .video-card {
            position: relative;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror camera */
        }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            z-index: 2;
        }

        .cam-controls {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snap-btn-container {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }

        .snap-btn {
            background: linear-gradient(135deg, #ff4b72, #ff758c);
            font-size: 1.1rem;
            padding: 14px 32px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(255, 75, 114, 0.4);
            transition: all 0.2s ease;
        }

        .snap-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(255, 75, 114, 0.6);
        }

        /* Countdown Overlay */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .countdown-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .countdown-number {
            font-size: 6rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 75, 114, 0.8);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); }
            100% { transform: scale(1.2); }
        }

        /* Filter CSS mappings to videos */
        .filter-none video { filter: none; }
        .filter-sepia video { filter: var(--filter-sepia); }
        .filter-bw video { filter: var(--filter-bw); }
        .filter-romantic video { filter: var(--filter-romantic); }
        .filter-neon video { filter: var(--filter-neon); }
        .filter-warm video { filter: var(--filter-warm); }

        /* Modal for preview */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 16px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
        }

        .canvas-container {
            max-height: 60vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Distance Photo Booth <span>❤️</span></h1>
        <p class="subtitle">Snap real-time memories together, no matter the miles.</p>
    </header>

    <div class="app-container">
        <!-- Left Sidebar Controls -->
        <div class="controls-sidebar glass-panel">
            
            <!-- Connection Setup -->
            <div class="room-box">
                <div class="section-title">1. Connect Partner</div>
                <div class="connection-status">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText">Solo Mode (Not Connected)</span>
                </div>
                <div class="input-group">
                    <input type="text" id="roomIdInput" readonly placeholder="Your Room Code">
                    <button class="btn-secondary" id="copyBtn" onclick="copyRoomLink()">Copy</button>
                </div>
                <div class="input-group">
                    <input type="text" id="connectIdInput" placeholder="Partner's Code">
                    <button id="connectBtn" onclick="connectToPartner()">Join</button>
                </div>
            </div>

            <hr style="border:0; border-top:1px solid var(--border-color);">

            <!-- Layout Options -->
            <div>
                <div class="section-title">2. Choose Layout</div>
                <div class="btn-grid">
                    <button id="btn-strip" class="active" onclick="setLayout('strip')">3 Strip</button>
                    <button id="btn-grid4" onclick="setLayout('grid4')">2x2 Grid</button>
                    <button id="btn-grid6" onclick="setLayout('grid6')">3x2 Grid</button>
                </div>
            </div>

            <!-- Filter Options -->
            <div>
                <div class="section-title">3. Visual Effect</div>
                <select id="filterSelect" class="select-input" onchange="changeFilter(this.value)">
                    <option value="none">Normal / Original</option>
                    <option value="romantic">Soft Pink Glow</option>
                    <option value="sepia">Vintage Sepia</option>
                    <option value="bw">Classic B&W</option>
                    <option value="warm">Warm Film Grain</option>
                    <option value="neon">Cyberpunk Neon</option>
                </select>
            </div>

            <!-- Frame/Border Options -->
            <div>
                <div class="section-title">4. Frame Style</div>
                <select id="frameSelect" class="select-input">
                    <option value="white">Polaroid White</option>
                    <option value="pink">Pastel Pink</option>
                    <option value="dark">Noir Black</option>
                    <option value="hearts">Cute Hearts & Sparkles</option>
                </select>
            </div>

            <!-- Custom Stamp Text -->
            <div>
                <div class="section-title">5. Photo Strip Label</div>
                <input type="text" id="stampText" class="select-input" value="Us across the miles ❤️" maxlength="30">
            </div>

        </div>

        <!-- Right Main Viewfinders -->
        <div class="main-stage">
            <div id="viewfinders" class="viewfinders filter-none">
                
                <!-- Local Video -->
                <div class="video-card">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="video-label">You</div>
                    <div class="cam-controls">
                        <button class="icon-btn" onclick="flipCamera()" title="Flip Camera">🔄</button>
                    </div>
                </div>

                <!-- Remote Video -->
                <div class="video-card">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label" id="remoteLabel">Partner (Waiting...)</div>
                </div>

            </div>

            <!-- Capture CTA -->
            <div class="snap-btn-container">
                <button class="snap-btn" onclick="triggerCountdown()">📸 Take Photos</button>
            </div>

            <!-- Countdown Overlay -->
            <div id="countdownOverlay" class="countdown-overlay">
                <div id="countdownNumber" class="countdown-number">3</div>
            </div>
        </div>
    </div>

    <!-- Preview & Export Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.2rem; color: #fff;">Your Photo Strip! 🎉</h2>
            <div class="canvas-container">
                <canvas id="photoCanvas"></canvas>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Retake</button>
                <button id="downloadBtn" onclick="downloadPhoto()">💾 Save Photo</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let peer = null;
        let conn = null;
        let mediaConn = null;
        let localStream = null;
        let currentFacingMode = 'user';
        let currentLayout = 'strip'; // strip, grid4, grid6
        let currentFilter = 'none';
        let myPeerId = '';
        let capturedFrames = [];

        // --- DOM Elements ---
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const roomIdInput = document.getElementById('roomIdInput');
        const connectIdInput = document.getElementById('connectIdInput');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const remoteLabel = document.getElementById('remoteLabel');
        const viewfinders = document.getElementById('viewfinders');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');
        const previewModal = document.getElementById('previewModal');
        const photoCanvas = document.getElementById('photoCanvas');

        // --- Initialize Camera ---
        async function startCamera() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 960 } },
                    audio: false
                });
                localVideo.srcObject = localStream;

                // Replace track in existing peer connection if active
                if (mediaConn && mediaConn.peerConnection) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = mediaConn.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            } catch (err) {
                alert('Camera access denied or unavailble.');
                console.error(err);
            }
        }

        async function flipCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            await startCamera();
        }

        // --- PeerJS & WebRTC ---
        function initPeer() {
            // Generate 4-digit room code
            const shortId = Math.floor(1000 + Math.random() * 9000).toString();
            myPeerId = 'couple-pb-' + shortId;

            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                roomIdInput.value = shortId;
                
                // Auto join via URL param if present
                const urlParams = new URLSearchParams(window.location.search);
                const roomParam = urlParams.get('room');
                if (roomParam && roomParam !== shortId) {
                    connectIdInput.value = roomParam;
                    connectToPartner();
                }
            });

            // Incoming Data Connection
            peer.on('connection', (dataConn) => {
                conn = dataConn;
                setupDataConnection();
            });

            // Incoming Media Call
            peer.on('call', (call) => {
                mediaConn = call;
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    updateConnectedUI(true);
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                if(err.type === 'peer-not-found') {
                    alert('Partner code not found. Please check and try again.');
                }
            });
        }

        function connectToPartner() {
            const targetCode = connectIdInput.value.trim();
            if (!targetCode) return;

            const targetPeerId = 'couple-pb-' + targetCode;

            // Connect Data Channel
            conn = peer.connect(targetPeerId);
            setupDataConnection();

            // Call Remote Peer Video
            mediaConn = peer.call(targetPeerId, localStream);
            mediaConn.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                updateConnectedUI(true);
            });
        }

        function setupDataConnection() {
            conn.on('open', () => {
                updateConnectedUI(true);
            });

            conn.on('data', (data) => {
                // Sync signals between users
                if (data.type === 'START_COUNTDOWN') {
                    runCountdown(false);
                } else if (data.type === 'CHANGE_FILTER') {
                    applyFilterUI(data.filter);
                } else if (data.type === 'CHANGE_LAYOUT') {
                    applyLayoutUI(data.layout);
                }
            });

            conn.on('close', () => {
                updateConnectedUI(false);
            });
        }

        function updateConnectedUI(isConnected) {
            if (isConnected) {
                statusDot.classList.add('connected');
                statusText.innerText = 'Connected to Partner! ❤️';
                remoteLabel.innerText = 'Partner';
            } else {
                statusDot.classList.remove('connected');
                statusText.innerText = 'Solo Mode (Not Connected)';
                remoteLabel.innerText = 'Partner (Waiting...)';
                remoteVideo.srcObject = null;
            }
        }

        function copyRoomLink() {
            const code = roomIdInput.value;
            const url = `${window.location.origin}${window.location.pathname}?room=${code}`;
            navigator.clipboard.writeText(url).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = 'Copied!';
                setTimeout(() => copyBtn.innerText = 'Copy', 2000);
            });
        }

        // --- UI & Controls Sync ---
        function setLayout(layout) {
            applyLayoutUI(layout);
            if (conn && conn.open) {
                conn.send({ type: 'CHANGE_LAYOUT', layout: layout });
            }
        }

        function applyLayoutUI(layout) {
            currentLayout = layout;
            document.querySelectorAll('.btn-grid button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${layout}`).classList.add('active');
        }

        function changeFilter(filter) {
            applyFilterUI(filter);
            if (conn && conn.open) {
                conn.send({ type: 'CHANGE_FILTER', filter: filter });
            }
        }

        function applyFilterUI(filter) {
            currentFilter = filter;
            document.getElementById('filterSelect').value = filter;
            viewfinders.className = `viewfinders filter-${filter}`;
        }

        // --- Photo Capture Logic ---
        function triggerCountdown() {
            if (conn && conn.open) {
                conn.send({ type: 'START_COUNTDOWN' });
            }
            runCountdown(true);
        }

        function runCountdown(isInitiator) {
            let count = 3;
            countdownNumber.innerText = count;
            countdownOverlay.classList.add('active');

            // Determine photo sequence count based on layout
            const photoCount = currentLayout === 'strip' ? 3 : (currentLayout === 'grid4' ? 4 : 6);
            capturedFrames = [];

            let currentShot = 0;

            function takeNextShot() {
                let interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownNumber.innerText = count;
                    } else {
                        clearInterval(interval);
                        countdownNumber.innerText = '📸';
                        
                        // Snap current frame
                        snapFrame();
                        currentShot++;

                        setTimeout(() => {
                            if (currentShot < photoCount) {
                                count = 3;
                                countdownNumber.innerText = count;
                                takeNextShot();
                            } else {
                                countdownOverlay.classList.remove('active');
                                renderFinalPhotoStrip();
                            }
                        }, 800);
                    }
                }, 1000);
            }

            takeNextShot();
        }

        function snapFrame() {
            // Offscreen canvas for individual snapshot
            const c = document.createElement('canvas');
            c.width = 640;
            c.height = 480;
            const ctx = c.getContext('2d');

            const hasRemote = remoteVideo.srcObject && remoteVideo.readyState === 4;

            if (hasRemote) {
                // Split Screen Canvas (Side by Side)
                // Left: Local video (Mirrored)
                ctx.save();
                ctx.translate(320, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(localVideo, 0, 0, 320, 480);
                ctx.restore();

                // Right: Remote Video
                ctx.drawImage(remoteVideo, 320, 0, 320, 480);

                // Divider Line
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(320, 0);
                ctx.lineTo(320, 480);
                ctx.stroke();
            } else {
                // Solo Mode (Full Frame Mirrored)
                ctx.save();
                ctx.translate(640, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(localVideo, 0, 0, 640, 480);
                ctx.restore();
            }

            // Apply Canvas Filter equivalent
            applyCanvasFilter(ctx, c.width, c.height);

            capturedFrames.push(c);
        }

        function applyCanvasFilter(ctx, w, h) {
            const imgData = ctx.getImageData(0, 0, w, h);
            const d = imgData.data;

            if (currentFilter === 'sepia') {
                for (let i = 0; i < d.length; i += 4) {
                    let r = d[i], g = d[i+1], b = d[i+2];
                    d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                }
            } else if (currentFilter === 'bw') {
                for (let i = 0; i < d.length; i += 4) {
                    let v = 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2];
                    d[i] = d[i+1] = d[i+2] = v;
                }
            } else if (currentFilter === 'romantic') {
                for (let i = 0; i < d.length; i += 4) {
                    d[i] = Math.min(255, d[i] * 1.15 + 20); // boost red/pink
                    d[i+2] = Math.min(255, d[i+2] * 1.05 + 10);
                }
            } else if (currentFilter === 'warm') {
                for (let i = 0; i < d.length; i += 4) {
                    d[i] = Math.min(255, d[i] * 1.1);
                    d[i+1] = Math.min(255, d[i+1] * 1.05);
                }
            } else if (currentFilter === 'neon') {
                for (let i = 0; i < d.length; i += 4) {
                    d[i] = (d[i] < 128) ? d[i] * 0.5 : d[i] * 1.3;
                    d[i+2] = Math.min(255, d[i+2] * 1.4);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // --- Render Final Composite Strip ---
        function renderFinalPhotoStrip() {
            const frameStyle = document.getElementById('frameSelect').value;
            const customText = document.getElementById('stampText').value || 'Us across the miles ❤️';
            
            const padding = 24;
            const headerHeight = 20;
            const footerHeight = 90;
            const frameGap = 16;
            
            const photoW = 600;
            const photoH = 450;

            let cols = 1, rows = 3;
            if (currentLayout === 'grid4') { cols = 2; rows = 2; }
            if (currentLayout === 'grid6') { cols = 2; rows = 3; }

            const canvasW = (photoW * cols) + (padding * 2) + (frameGap * (cols - 1));
            const canvasH = (photoH * rows) + padding + footerHeight + headerHeight + (frameGap * (rows - 1));

            photoCanvas.width = canvasW;
            photoCanvas.height = canvasH;

            const ctx = photoCanvas.getContext('2d');

            // 1. Draw Background / Frame Style
            if (frameStyle === 'white') {
                ctx.fillStyle = '#f8f9fa';
            } else if (frameStyle === 'pink') {
                ctx.fillStyle = '#ffd1dc';
            } else if (frameStyle === 'dark') {
                ctx.fillStyle = '#18181b';
            } else if (frameStyle === 'hearts') {
                ctx.fillStyle = '#ffe6ea';
            }

            ctx.fillRect(0, 0, canvasW, canvasH);

            // Cute Hearts Pattern if selected
            if (frameStyle === 'hearts') {
                ctx.font = '20px serif';
                for (let x = 10; x < canvasW; x += 40) {
                    for (let y = 20; y < canvasH; y += 40) {
                        ctx.fillText('✨', x, y);
                        ctx.fillText('💗', x + 20, y + 20);
                    }
                }
            }

            // 2. Draw Photos onto Canvas
            capturedFrames.forEach((frameCanvas, index) => {
                const r = Math.floor(index / cols);
                const c = index % cols;

                const x = padding + c * (photoW + frameGap);
                const y = headerHeight + padding + r * (photoH + frameGap);

                ctx.drawImage(frameCanvas, x, y, photoW, photoH);

                // Thin inner border around each photo
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, photoW, photoH);
            });

            // 3. Draw Footer Text & Timestamp
            const textColor = (frameStyle === 'dark') ? '#ffffff' : '#2d3748';
            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';

            // Custom Text
            ctx.font = 'bold 28px -apple-system, sans-serif';
            ctx.fillText(customText, canvasW / 2, canvasH - footerHeight + 35);

            // Date Stamp
            const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            ctx.font = '500 18px -apple-system, sans-serif';
            ctx.fillStyle = (frameStyle === 'dark') ? '#a1a1aa' : '#718096';
            ctx.fillText(today + ' • Distance Photo Booth', canvasW / 2, canvasH - footerHeight + 65);

            // Show Preview Modal
            previewModal.classList.add('active');

            // Trigger Confetti Celebration
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
        }

        function downloadPhoto() {
            const dataURL = photoCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `Couple_Photo_Booth_${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        }

        function closeModal() {
            previewModal.classList.remove('active');
        }

        // --- App Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            startCamera();
            initPeer();
        });
    </script>
</body>
</html>
